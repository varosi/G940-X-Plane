# Installed at Resources/plugins/g940FF/aircraft.ini, beside the 64 folder.
# Reload by disabling/re-enabling g940FF in Plugin Admin. Aircraft changes
# select a preset automatically. Additional presets inherit General values.
# These are provisional force-feedback settings, not measured aircraft forces.
# Live pressure, trim and AoA always come from X-Plane.

[General]
# auto uses X-Plane acf_Vne as a SCALING HEURISTIC, not a measured force point.
# Vne is indicated airspeed; converting it to reference pressure here uses
# the low-Mach IAS/EAS approximation. Use a numeric KEAS value for calibration.
# Missing, zero or invalid Vne uses the fallback below.
reference_speed_knots = auto
fallback_reference_speed_knots = 125
mechanical_ratio = 0.2
# X-Plane's live trim is already a fraction of maximum control deflection.
roll_trim_gain = 1.0
pitch_trim_gain = 1.0
pitch_aoa_gain = 0.03
neutral_aoa_degrees = 0

[Socata TB10/TB20]
match_icao = TOBA, TRIN
# Also recognizes the tested combined JF_Socata_TB10+TB20.acf model.
match_acf = *TB10*.acf, *TB20*.acf, *TB-10*.acf, *TB-20*.acf
# Preserves the initial TB10/TB20 tuning; this reference is adjustable.
reference_speed_knots = 125
roll_trim_gain = 3.0
pitch_trim_gain = 1.5
