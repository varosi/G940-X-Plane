# Installed at Resources/plugins/g940FF/aircraft.ini, beside the 64 folder.
# Shared by g940FF and g940LEDs. Reload each plugin by disabling/re-enabling it
# in Plugin Admin. Aircraft changes
# select a preset automatically. Additional presets inherit General values.
# These are provisional force-feedback settings, not measured aircraft forces.
# Live pressure, trim and AoA always come from X-Plane.

[General]
# P1-P8 throttle LEDs. Aircraft presets can override individual assignments.
# Existing indications retain their equipment checks; fixed colors are always on.
# Custom examples (numeric scalars or arrays; array indices start at zero):
# led_7 = dataref:sim/cockpit2/switches/navigation_lights_on
# led_8 = dataref:sim/flightmodel2/gear/deploy_ratio[0], 0, 1
# Without thresholds, zero is red and nonzero is green. With low/high thresholds,
# values <= low are red, values >= high are green, and values between are amber.
# Missing, nonnumeric or nonfinite data is off. Use off to disable an LED.
# Other built-in choices: engine_running, navigation_lights, parking_brake, brakes.
# engine_running: green all running, red all stopped, amber mixed engines.
# navigation_lights: green on, red off. Brake indicators: green released,
# amber partial, red fully applied. parking_brake shows parking control/valve;
# brakes shows the largest master/left/right brake demand, not trapped pressure.
led_1 = speedbrake_upper
led_2 = flaps_upper
led_3 = carb_heat
led_4 = autopilot
led_5 = speedbrake_lower
led_6 = flaps_lower
led_7 = landing_lights
led_8 = gear

# auto uses X-Plane acf_Vne as a SCALING HEURISTIC, not a measured force point.
# Vne is indicated airspeed; converting it to reference pressure here uses
# the low-Mach IAS/EAS approximation. Use a numeric KEAS value for calibration.
# Missing, zero or invalid Vne uses the fallback below.
reference_speed_knots = auto
fallback_reference_speed_knots = 125
mechanical_ratio = 0.2
# Independent aerodynamic stiffness at the reference pressure. The two spring
# terms are summed only when rendering, within the existing motor ceilings.
# Omitting this key (or auto) retains the legacy value 1 - mechanical_ratio.
aerodynamic_gain = 0.8
# Damping opposes movement, not displacement. Its mechanical part stays at rest;
# its aerodynamic part scales with q/qref. The total is capped at the tested 8/4096.
mechanical_damping = 0.2
aerodynamic_damping = 0.8
# Optional tactile cues; enable only after choosing an aircraft-specific profile.
turbulence_gain = 0
stall_buffet_gain = 0
stall_buffet_idle_ratio = 0.25
stall_buffet_hz = 5
# X-Plane's live trim is already a fraction of maximum control deflection.
roll_trim_gain = 1.0
pitch_trim_gain = 1.0
# A linear hinge-load approximation: degrees of free elevator / degree of AoA.
# It is not an airframe pitching moment or a measured force calibration.
pitch_aoa_deflection_gain = 0.45
neutral_aoa_degrees = 0
# auto reads usable X-Plane geometry; travel falls back to 15 degrees and
# static trim to zero. Explicit numeric values override simulator metadata.
elevator_up_degrees = auto
elevator_down_degrees = auto
static_pitch_trim = auto
# auto recognizes a trimmable stabilizer from its travel, otherwise a trim tab.
# Use spring explicitly for reversible, mechanically preloaded pitch trim.
pitch_trim_mode = auto

[Socata TB10/TB20]
match_icao = TOBA, TRIN
# Also recognizes the tested combined JF_Socata_TB10+TB20.acf model.
match_acf = *TB10*.acf, *TB20*.acf, *TB-10*.acf, *TB-20*.acf
# Preserves the initial TB10/TB20 tuning; this reference is adjustable.
reference_speed_knots = 125
roll_trim_gain = 3.0
pitch_trim_gain = 1.5
pitch_trim_mode = aerodynamic
# TB20-based provisional feel: natural buffet is weak at idle and increases
# with power. The real aircraft has an audible horn, not a stick shaker.
# Gains are center displacement (gust gain per m/s), not measured yoke forces.
turbulence_gain = 0.015
stall_buffet_gain = 0.06
