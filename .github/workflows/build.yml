name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build both plugins
        run: make -j2
      - name: Test protocol, datarefs, lifecycle, and installer
        run: make test

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            curl
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build both plugins
        run: make -j2 PLATFORM=windows
      - name: Test protocol, datarefs, lifecycle, and installer
        run: make test PLATFORM=windows
